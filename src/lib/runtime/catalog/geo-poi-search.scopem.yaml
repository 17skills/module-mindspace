apiVersion: scopebuilder.io/v1alpha1
kind: ScopeModule
metadata:
  name: geo-poi-search
  version: 1.0.0
  title: Points of Interest Search
  description: >-
    Generic search for points of interest of a given category within a radius
    around a geographic point. Specializations only preset the category.
  category: data-source
  tags:
    - geospatial
    - poi
    - openstreetmap
  author: scopebuilder
  license: Apache-2.0
  nodeType: api
spec:
  extends:
    ref: core/http-request
    version: ^1.0.0
  ontology:
    domain: geospatial/places
    depth: guarded
    constraints:
      - id: valid-coordinates
        label: Coordinates within valid WGS84 boundary
        subject: inputs.location
        severity: violation
        rationale: Coordinates outside the valid range are rejected before the call.
      - id: fair-use-rate-limit
        label: Public service fair use
        subject: engine.url
        severity: info
        rationale: >-
          The public Overpass service enforces fair use; heavy polling returns
          HTTP 429 or 504, so results are cached and never polled automatically.
        reference: https://wiki.openstreetmap.org/wiki/Overpass_API
        requires: Keep the cache enabled and avoid automatic polling.
  presets:
    url: https://overpass-api.de/api/interpreter
    method: POST
  inputs:
    location:
      semantic: geo:point
      title: Search Center
      description: WGS84 coordinates used as the center of the search radius.
      required: true
      schema:
        type: object
        properties:
          lat:
            type: number
            minimum: -90
            maximum: 90
          lon:
            type: number
            minimum: -180
            maximum: 180
    radius:
      semantic: primitive:number
      title: Search Radius
      description: Radius in meters around the search center.
      required: false
      unit: meters
      default: 1000
      schema:
        type: integer
        minimum: 50
        maximum: 5000
    category:
      semantic: primitive:string
      title: Place Category
      description: OpenStreetMap amenity tag, for example restaurant, cafe or pharmacy.
      required: true
  engine:
    type: api
    ref: https://overpass-api.de/api/interpreter
    config:
      method: POST
      url: https://overpass-api.de/api/interpreter
      timeoutSeconds: 25
      bodyTemplate: |
        [out:json][timeout:25];
        (node["amenity"="{{inputs.category}}"](around:{{inputs.radius}},{{inputs.location.lat}},{{inputs.location.lon}}););
        out body;
  outputs:
    places:
      semantic: geo:features
      title: Found Places
      description: Collection of places with name, coordinates and tags.
      extractPath: elements
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            lat:
              type: number
            lon:
              type: number
            name:
              type: string
            cuisine:
              type: string
      mapping:
        id: id
        lat: lat
        lon: lon
        name: tags.name
        cuisine: tags.cuisine
  execution:
    mode: reactive
    timeoutSeconds: 30
  resilience:
    retry:
      maxAttempts: 3
      backoff: exponential
    cache:
      ttlSeconds: 600
    onError: fallback
  requirements:
    network:
      - overpass-api.de
  settings:
    pointsPath: elements
